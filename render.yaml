services:
  - type: web
    name: apexbot-5lco
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: FIREBASE_PROJECT_ID
        value: apexbot-discord
      - key: DISCORD_CLIENT_ID
        value: "1501215133345648801"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: DASHBOARD_URL
        value: https://apexbot-5lco.onrender.com
      - key: DISCORD_REDIRECT_URI
        value: https://apexbot-5lco.onrender.com/api/auth/discord/callback
